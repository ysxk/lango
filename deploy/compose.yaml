name: lango

x-app: &app
  image: lango-server:local
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  environment: &environment
    LANGO_ENVIRONMENT: ${LANGO_ENVIRONMENT:-development}
    LANGO_DATABASE_URL: postgresql+psycopg://lango:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/lango
    LANGO_MEMORY_POSTGRES_URL: postgresql://lango:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/lango
    LANGO_JWT_SECRET: ${LANGO_JWT_SECRET:?Set LANGO_JWT_SECRET in deploy/.env}
    LANGO_GOOGLE_API_KEY: ${LANGO_GOOGLE_API_KEY:-}
    LANGO_ALLOWED_ORIGINS: ${LANGO_ALLOWED_ORIGINS:-[]}
    LANGO_TEXT_MODEL: ${LANGO_TEXT_MODEL:-gemini-3.8-flash}
    LANGO_TTS_MODEL: ${LANGO_TTS_MODEL:-gemini-3.8-flash-lite-tts}
    LANGO_LIVE_MODEL: ${LANGO_LIVE_MODEL:-gemini-3.8-live}
    LANGO_EMBEDDING_MODEL: ${LANGO_EMBEDDING_MODEL:-gemini-embedding-001}
    LANGO_DEFAULT_ENGINE: ${LANGO_DEFAULT_ENGINE:-cascade}
    LANGO_DAILY_MINUTES: ${LANGO_DAILY_MINUTES:-60}
    LANGO_MEMORY_PATH: /data/memory
    MEM0_TELEMETRY: "false"
  volumes:
    - memory:/data/memory
  stop_grace_period: 30s

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: lango
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: lango
    volumes:
      - database:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U lango -d lango"]
      interval: 5s
      timeout: 3s
      retries: 15

  server:
    <<: *app
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    <<: *app
    command: [python, -m, lango.worker]
    depends_on:
      server:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    profiles: [public]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy

volumes:
  database:
  memory:
  caddy_data:
  caddy_config:
